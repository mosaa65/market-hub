# ---------------------------------------------------------------------------
# هويّة المشروع (Project Identifier)
# ---------------------------------------------------------------------------
project_id = "kwzqvgdyadylwnvjghqn"


# ---------------------------------------------------------------------------
# البيانات الافتتاحية والمثبتات (Database Seeding)
# ---------------------------------------------------------------------------
[db.seed]
# يُشغَّل تلقائيًا فقط ما يجعل النظام "نظامًا".
#
# supabase/seeds/01_system/ يحوي الصفوف التي لا يعمل النظام بدونها:
#   * 01_modules            — التطبيق يقرأ هذه الأكواد لتحديد الشاشات المتاحة.
#   * 02_plans              — باقات الاشتراك.
#   * 03_chart_of_accounts  — محرّك الترحيل يحلّ أكوادًا مثل '4111'.
#   * 04_units              — كل منتج يحمل وحدة.
#   * 05_expense_categories — نموذج المصروف يشترط تصنيفًا، مربوطة بحساباتها.
#   * 06_platform_admins    — بلا مسؤول منصة لا تُدار الباقات ولا الوحدات.
#   * 07_document_numbering — بلاها يرفض محرّك الترقيم توليد أي رقم.
#   * 08_payment_methods    — كل دفعة تمر منها + إعداد المنشأة الافتراضي.
#
# ⚠️ ممنوع أن يحوي هذا المسار بيانات أعمال أو هوية شركة:
#   * بيانات الأعمال (منتجات، عملاء، موردون، فواتير، مخزون) = قيود مُختلقة داخل دفاتر العميل.
#   * company_settings = الكتابة على اسم العميل وعملته ورقمه الضريبي.
#
# استثناء مقصود: 06_platform_admins يُنشئ صفوف auth.users حقيقية. هذا مبرَّر
# لأنه حساب **المنصة** لا حساب عميل: وجوده شرط لعمل اللوحة الإدارية، وهو
# نفسه في كل نسخة للنظام. حسابات المتجر تبقى ممنوعة تمامًا هنا — يملكها العميل وتُبنى من التطبيق.
#
# ملاحظة: جدول pacsqlkaging_types يبدأ فارغًا عن قصد. «شوال» و«كيس» لا يحملان
# وزنًا ولا يصفان شيئًا يحتاجه كل عميل، والمنتج الحقيقي هو «كيس 50 كجم».
#
# ملفات العيّنات اختيارية وخارج هذا المسار:
#   supabase/seeds/02_company/  — هوية العميل وأرصدته الافتتاحية.
#   supabase/seeds/03_samples/  — بيانات عرض لكل نشاط (مطحنة…).
#   supabase/seeds/04_tests/    — مثبتات الاختبارات الآلية.
# راجع supabase/seeds/README.md و supabase/docs/2026-10-12_guide_migrations-rules.md.

enabled = true
sql_paths = [
  "./seeds/01_system/*.sql",
]


# ---------------------------------------------------------------------------
# دوال الحافة (Edge Functions)
# ---------------------------------------------------------------------------
# admin-create-user provisions store staff accounts (Auth user + profile +
# store role) through the Supabase Admin API. That API requires a secret key
# which must never reach the browser, so this function is the only place the key is used.
#
# verify_jwt = true -> calls without a bearer token are rejected by the
# platform before the function body runs. The function additionally re-derives
# the caller's permissions from the database, so a valid token alone is never sufficient to create a user.
[functions.admin-create-user]
verify_jwt = true


# ---------------------------------------------------------------------------
# نظام المصادقة والحماية (Authentication)
# ---------------------------------------------------------------------------
[auth]
enable_signup = true


# ── قسم رسائل الهاتف (SMS Configuration) ───────────────────────────────────
[auth.sms]
# تسجيل الدخول بكلمة مرور أو OTP عبر الهاتف.
#
# لا تضف مفاتيح خارج مخطط Supabase CLI؛ المفتاح المرفوض يمنع start وdb reset.
#
# تسجيل الهاتف للتطوير المحلي. CLI يحذر من عدم وجود مزود SMS، لكن test_otp أدناه
# يوفر رمزًا ثابتًا للرقم التجريبي دون إرسال رسائل.
enable_signup = true
enable_confirmations = false

# OTP ثابت للتطوير المحلي ورقم العرض فقط؛ لا يعتمد على إرسال SMS.
# رقم الاختبار ورمزه ليسا سرّين، لكن لا تستخدمهما في السحابة أو لأي حساب حقيقي.
[auth.sms.test_otp]
"+967772217218" = "123456"

# ── مزوّد الهاتف الخارجي (External Phone Provider) ────────────────────────
[auth.external.phone]
# مزوّد الهاتف — إصلاح 2026-10-13:
# كان الدخول بالهاتف يفشل دائماً بـ {"error_code":"phone_provider_disabled"} لأن GoTrue يرى GOTRUE_EXTERNAL_PHONE_ENABLED=false.
# قسم [auth.external.phone] هو المخطط المعتمد للتحكم بالمزود السحابي والمحلي.
#
# Auth المحلي يقبل رقم الاختبار أعلاه دون إرسال SMS خارجي.
enabled = true
client_id = "local-dev-placeholder"
secret = "local-dev-placeholder-not-a-real-secret"

# لا تضف مفاتيح template أو مزود SMS وهميًا هنا؛ استخدم إعداد مزود حقيقي
# للسحابة فقط. إعداد SMS السحابي مستقل عن OTP المحلي.
