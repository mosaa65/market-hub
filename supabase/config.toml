[db.seed]
# ONLY the safe, idempotent reference file runs automatically.
#
# It must never contain business data, accounts, or company identity:
#   * business data (products, customers, suppliers, invoices, stock) would be
#     fabricated records inside a customer's books
#   * accounts would create real auth.users rows on every reset
#   * company_settings would overwrite the customer's own name/currency/tax
#
# Demo datasets are opt-in and live outside this path:
#   supabase/seeds/demo/wholesale-retail.sql   (grocery / wholesale+retail)
#   supabase/seeds/demo/stationery.sql         (office supplies)
#   supabase/seeds/demo/accounts.sql           (demo users, never auto-run)
# See supabase/seeds/README.md for how to run them.
enabled = true
sql_paths = ["./seeds/reference.sql"]

# ---------------------------------------------------------------------------
# Edge Functions
# ---------------------------------------------------------------------------
# admin-create-user provisions store staff accounts (Auth user + profile +
# store role) through the Supabase Admin API. That API requires a secret key
# which must never reach the browser, so this function is the only place the
# key is used.
#
# verify_jwt = true -> calls without a bearer token are rejected by the
# platform before the function body runs. The function additionally re-derives
# the caller's permissions from the database, so a valid token alone is never
# sufficient to create a user.
[functions.admin-create-user]
verify_jwt = true
